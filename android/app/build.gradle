plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def releaseSigningKeys = ['keyAlias', 'keyPassword', 'storeFile', 'storePassword']
def hasReleaseSigning = keystorePropertiesFile.exists() &&
        releaseSigningKeys.every { key ->
            def value = keystoreProperties[key]
            value != null && !value.toString().trim().isEmpty()
        }

def isReleaseBuild = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase().contains('release')
}

if (isReleaseBuild && !hasReleaseSigning) {
    throw new GradleException(
        "Release signing is not configured. Add android/key.properties locally before building a release."
    )
}

android {
    namespace = "forestring.teacher.app"
    compileSdk = 36
    ndkVersion = "28.2.13676358"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "forestring.teacher.app"
        minSdk = 24
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig = signingConfigs.release
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

flutter {
    source = "../.."
}
